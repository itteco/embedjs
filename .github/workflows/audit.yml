name: Audit

# Compares pnpm audit against the committed audit.log snapshot, so a new
# advisory fails the run until someone reviews it and refreshes the
# snapshot. Every branch audits its own lockfile: on push, and on PRs
# against the merge result. The schedule matters too: advisories change
# over time without any code changes. GitHub only runs schedules on the
# default branch, so a stale snapshot there fails that run, not your
# branch's.
on:
    workflow_dispatch:
    push:
        branches: ['**']
    pull_request:
        branches: [dev, main]
    schedule:
        - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Keep in sync with the local pnpm version (and ci.yml). Audit
            # works off pnpm-lock.yaml, no install needed.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version

            - name: Verify audit.log matches pnpm audit
              run: |
                  pnpm audit > audit-current.log || true
                  if ! diff -u --strip-trailing-cr audit.log audit-current.log; then
                    echo "::error::audit.log is stale. The diff above shows what changed. Review the advisories, then refresh the snapshot with: pnpm audit > audit.log"
                    exit 1
                  fi
