name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Actions are pinned to commit SHAs; the comment names the release.

jobs:
    check:
        name: Typecheck, lint, unit tests, build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Keep in sync with the local pnpm version.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # Also enforces the lockfile's supply-chain policies.
            - run: pnpm install --frozen-lockfile

            # Vulnerabilities: see audit.yml.
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm test

            - run: pnpm build

            # dist/ is committed: it must be exactly what the sources build to.
            - name: Check that the committed dist/ is up to date
              run: |
                  if [ -n "$(git status --porcelain -- dist)" ]; then
                    git status --short -- dist
                    echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
                    exit 1
                  fi

            - run: pnpm test:pkg

    e2e:
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm exec playwright install --with-deps chromium firefox webkit

            - run: pnpm test:e2e

            - if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-test-results
                  path: test-results/
                  retention-days: 7
